name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      # Sin DATABASE_URL: el test de integración de migraciones se saltea solo.
      - run: bun run test

      # `dist/` está commiteado a propósito: bun bloquea los scripts de ciclo
      # de vida, así que un `prepare` no correría al instalar desde git y el
      # consumidor recibiría un paquete sin compilar. El precio es que puede
      # quedar desincronizado con el fuente, y esto lo impide.
      - name: dist está al día con el fuente
        run: |
          bun run build:client
          git diff --exit-code dist || {
            echo "::error::dist quedó desincronizado. Corré 'bun run build:client' y commiteá."
            exit 1
          }
